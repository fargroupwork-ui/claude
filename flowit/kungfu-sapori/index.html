<title>FlowIt Pro · Kung Fu Sapori</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&family=Noto+Serif+SC:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-first app shell. Bottom tab bar switches four views (Cliente, Cucina, Titolare, Proposta);
   the customer menu is a single 560px column, staff views widen into grids on desktop. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E8EEEB; --ink:#13201C; --muted:#5A6A65; --line:#D9E1DD;
  --jade:#0D6A5B; --jade-ink:#FFFFFF; --cinnabar:#BF3428; --gold:#A87A1F; --plum:#7A3E6A;
  --ok:#1F7A4D; --warn:#B36B00; --crit:#B3261E;
  --shadow:0 1px 2px rgba(19,32,28,.06),0 6px 20px rgba(19,32,28,.06);
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-han:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --tab-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#16201C; --surface-2:#1E2A26; --ink:#E6EEEA; --muted:#93A49E; --line:#283632;
  --jade:#3DB39A; --jade-ink:#06201A; --cinnabar:#E35A4C; --gold:#D8A847; --plum:#C27BB0;
  --ok:#4CC28A; --warn:#E0A040; --crit:#F0675C; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#16201C; --surface-2:#1E2A26; --ink:#E6EEEA; --muted:#93A49E; --line:#283632;
  --jade:#3DB39A; --jade-ink:#06201A; --cinnabar:#E35A4C; --gold:#D8A847; --plum:#C27BB0;
  --ok:#4CC28A; --warn:#E0A040; --crit:#F0675C; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.25rem}
h3{font-size:1rem}
p{margin:0}
.han{font-family:var(--f-han)}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.wrap{max-width:1100px;margin:0 auto}
.col{max-width:560px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center}
.demo-flag{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;color:var(--warn);
  border:1px solid color-mix(in oklab,var(--warn) 45%,transparent);border-radius:999px;padding:2px 8px}

/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px 6px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:.95rem}
.brand-mark{width:22px;height:22px;border-radius:6px;background:var(--jade);display:grid;place-items:center}
.brand-mark svg{display:block}
.brand small{font-weight:600;color:var(--jade);margin-left:2px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:.8rem;font-weight:600}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:600;position:relative}
.tabbar a svg{width:22px;height:22px}
.tabbar a[aria-current="page"]{color:var(--jade)}
.tabbar a[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--jade)}
.tabbar .badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--cinnabar);color:#fff;font-size:.68rem;display:grid;place-items:center;padding:0 5px}

/* restaurant hero */
.resto{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding-block:10px 4px}
.seal{width:64px;height:64px;border-radius:12px;background:var(--cinnabar);color:#fff;display:grid;place-items:center;
  font-family:var(--f-han);font-weight:700;font-size:1.35rem;line-height:1;writing-mode:vertical-rl;letter-spacing:.06em;box-shadow:var(--shadow)}
.resto h1{font-size:1.45rem}
.resto .meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.82rem;color:var(--muted);margin-top:2px}
.stars{color:var(--gold);letter-spacing:1px}
.table-pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:600}
.table-pill b{color:var(--jade)}

.status-strip{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.88rem}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.dot.new{background:var(--warn)} .dot.prep{background:var(--jade)} .dot.ready{background:var(--ok);box-shadow:0 0 0 4px color-mix(in oklab,var(--ok) 25%,transparent)}

.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;font-size:.8rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
.quick svg{width:20px;height:20px;color:var(--jade)}

/* signature */
.sig-scroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,78%);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;margin-inline:-2px;padding-inline:2px}
.sig{scroll-snap-align:start;border-radius:16px;padding:14px;color:#fff;background:var(--cinnabar);display:flex;flex-direction:column;gap:6px;min-height:150px;position:relative;overflow:hidden}
.sig.jade{background:var(--jade);color:var(--jade-ink)}
.sig.gold{background:var(--gold)}
.sig .big{font-family:var(--f-han);font-size:2.6rem;line-height:1;opacity:.22;position:absolute;right:10px;top:8px}
.sig h3{font-size:1.05rem;max-width:80%}
.sig p{font-size:.82rem;opacity:.9;max-width:85%}
.sig .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center}
.sig .price{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.sig button{background:rgba(255,255,255,.95);color:#13201C;border:0;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.82rem}

.lunch{border:1.5px dashed color-mix(in oklab,var(--jade) 55%,transparent);border-radius:16px;padding:14px;background:color-mix(in oklab,var(--jade) 7%,var(--surface));display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.lunch .p{font-family:var(--f-display);font-weight:700;font-size:1.4rem;color:var(--jade)}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:700;font-size:.88rem;background:var(--jade);color:var(--jade-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.red{background:var(--cinnabar);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* filters */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{border:0;background:transparent;padding:11px 0;width:100%;outline:none}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.al[aria-pressed="true"]{background:var(--crit);border-color:var(--crit);color:#fff}
details.allerg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
details.allerg summary{cursor:pointer;font-weight:600;font-size:.88rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.allerg summary::-webkit-details-marker{display:none}
details.allerg .chips{flex-wrap:wrap;margin-top:10px;overflow:visible}
.note{font-size:.76rem;color:var(--muted)}

/* dishes */
.cat-head{display:flex;align-items:baseline;gap:8px;padding-top:10px;scroll-margin-top:12px}
.cat-head .han{font-size:1.1rem;color:var(--cinnabar)}
.dish{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.dish.off{opacity:.5}
.tile{width:52px;height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:color-mix(in oklab,var(--c) 14%,var(--surface));color:var(--c)}
.tile .g{font-family:var(--f-han);font-weight:700;font-size:1.3rem;line-height:1}
.tile .code{font-family:var(--f-mono);font-size:.62rem;opacity:.85}
.dish .names{min-width:0}
.dish .n1{font-weight:600;font-size:.95rem;line-height:1.25}
.dish .n2{font-size:.8rem;color:var(--muted);margin-top:1px}
.dish .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:.68rem;font-weight:600;border-radius:6px;padding:1px 6px;background:var(--surface-2);color:var(--muted)}
.tag.hot{background:color-mix(in oklab,var(--cinnabar) 15%,var(--surface));color:var(--cinnabar)}
.tag.veg{background:color-mix(in oklab,var(--ok) 15%,var(--surface));color:var(--ok)}
.tag.out{background:var(--ink);color:var(--bg)}
.dish .right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.dish .price{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.add{width:34px;height:34px;border-radius:50%;border:0;background:var(--jade);color:var(--jade-ink);display:grid;place-items:center;font-size:1.2rem;font-weight:700;line-height:1}
.add:disabled{background:var(--surface-2);color:var(--muted)}
.qty-badge{font-size:.72rem;font-weight:700;color:var(--jade)}
.variants{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.variants button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:3px 8px;font-size:.76rem;font-weight:600}
.variants button[aria-pressed="true"]{border-color:var(--jade);color:var(--jade);background:color-mix(in oklab,var(--jade) 10%,transparent)}
.empty{text-align:center;padding:28px 12px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

/* cart bar + sheets */
.cartbar{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 10px);z-index:25;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.cartbar button{pointer-events:auto;max-width:560px;margin:0 auto;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;
  border:0;border-radius:14px;padding:14px 16px;background:var(--ink);color:var(--bg);font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.cartbar .cnt{background:var(--jade);color:var(--jade-ink);border-radius:8px;padding:2px 8px;font-size:.8rem}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,14,12,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.close{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.1rem;line-height:1}
.line-item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.line-item .sub{font-size:.78rem;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-weight:700;line-height:1}
.totals{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.9rem}
.totals .grand{font-family:var(--f-display);font-weight:700;font-size:1.15rem;padding-top:6px;border-top:1px solid var(--line)}
label.field{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-weight:500;font-size:.95rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt-group{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.9rem}
.opt input{accent-color:var(--jade);width:18px;height:18px}
.opt .han{color:var(--muted);font-size:.85rem;margin-left:auto}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 80px);z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--shadow);transition:opacity .2s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* KDS */
.kds-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding-block:10px}
.alerts{display:flex;flex-wrap:wrap;gap:8px}
.alert{display:flex;align-items:center;gap:8px;background:color-mix(in oklab,var(--cinnabar) 12%,var(--surface));color:var(--cinnabar);border:1px solid color-mix(in oklab,var(--cinnabar) 40%,transparent);border-radius:10px;padding:8px 10px;font-size:.85rem;font-weight:600}
.alert button{border:0;background:var(--cinnabar);color:#fff;border-radius:8px;padding:3px 8px;font-size:.75rem;font-weight:700}
.kds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.lane{display:flex;flex-direction:column;gap:10px;min-width:0}
.lane-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.85rem;padding:0 2px}
.lane-h .n{font-family:var(--f-mono);color:var(--muted)}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.ticket .th{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-family:var(--f-mono);font-weight:600;font-size:.85rem;border-bottom:1px dashed var(--line)}
.ticket.new .th{background:color-mix(in oklab,var(--warn) 14%,var(--surface))}
.ticket.prep .th{background:color-mix(in oklab,var(--jade) 14%,var(--surface))}
.ticket.ready .th{background:color-mix(in oklab,var(--ok) 16%,var(--surface))}
.ticket.late .timer{color:var(--crit)}
.ticket ul{list-style:none;margin:0;padding:8px 12px;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.ticket li{display:grid;grid-template-columns:28px 1fr;gap:6px}
.ticket li b{font-family:var(--f-mono)}
.ticket li .zh{font-family:var(--f-han);color:var(--muted);font-size:.85rem}
.ticket .tn{font-size:.78rem;color:var(--warn);padding:0 12px 6px}
.ticket .tf{display:flex;gap:8px;padding:8px 12px 12px}
.ticket .tf .btn{flex:1;padding:8px 10px;font-size:.82rem}
.src-qr{font-size:.65rem;border-radius:5px;padding:1px 5px;background:var(--jade);color:var(--jade-ink);margin-left:6px;font-family:var(--f-body);font-weight:700}

/* owner */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:1.35rem;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.78rem;color:var(--muted)}
.kpi .d{font-size:.74rem;font-weight:600;color:var(--ok)}
.owner-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chart svg{width:100%;height:auto;display:block}
.top-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.top-list li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.88rem}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade);border-radius:3px}
.review{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.review:first-of-type{border-top:0;padding-top:0}
.review .who{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;font-weight:600}
.review .txt{font-size:.88rem}
.review .reply{font-size:.82rem;color:var(--muted);border-left:2px solid var(--jade);padding-left:8px}
.review textarea{width:100%;min-height:90px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:.88rem;resize:vertical}
.pill{font-size:.7rem;font-weight:700;border-radius:999px;padding:2px 8px}
.pill.ok{background:color-mix(in oklab,var(--ok) 15%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in oklab,var(--warn) 16%,transparent);color:var(--warn)}
.avail{display:flex;flex-direction:column;gap:0;max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.avail label{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:.86rem}
.avail label:last-child{border-bottom:0}
.switch{appearance:none;width:40px;height:24px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);position:relative;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.switch:checked{background:var(--jade);border-color:var(--jade)}
.switch:checked::after{left:18px}
.book{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;font-size:.88rem;padding:8px 0;border-top:1px solid var(--line)}
.book:first-child{border-top:0}
.book .t{font-family:var(--f-mono);font-weight:600}

/* proposal */
.prop-hero{padding-block:16px 8px;display:flex;flex-direction:column;gap:8px}
.prop-hero h1{font-size:1.7rem}
.prop-hero h1 em{font-style:normal;color:var(--cinnabar)}
.fit{display:grid;gap:10px}
.fit-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fit-row > div{padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.fit-row > div:first-child{border-right:1px solid var(--line)}
.fit-row .k{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.fit-row .seen .k{color:var(--muted)}
.fit-row .does .k{color:var(--jade)}
.fit-row p{font-size:.88rem}
.fit-row button{align-self:flex-start;margin-top:4px;border:0;background:none;color:var(--jade);font-weight:700;font-size:.8rem;padding:0;text-decoration:underline;text-underline-offset:3px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;font-size:.9rem;counter-increment:s}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:.8rem}
.sources{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}

@media (max-width:860px){
  .kds{grid-template-columns:1fr}
  .owner-grid{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .fit-row{grid-template-columns:1fr}
  .fit-row > div:first-child{border-right:0;border-bottom:1px solid var(--line)}
}

function sigCard(code,cls,g,t,p,price){
  const out=S.soldOut.has(code);

    <span class="eyebrow" style="color:inherit;opacity:.8">N. ${code}</span><h3>${t}</h3><p>${p}</p>

function visible(m){
  if(S.cat!=='all' && m.k!==S.cat) return false;
  if(S.excl.size && m.a.some(a=>S.excl.has(a))) return false;
  if(S.q){const q=S.q.trim().toLowerCase(); if(q && !(m.n.toLowerCase().includes(q)||m.z.includes(q)||m.c.toLowerCase()===q)) return false;}
  return true;
}

function dishHTML(m){

  const tags=[]; if(m.f.includes('s'))tags.push('<span class="tag" style="color:var(--cinnabar)">Della casa</span>');

/* ---------- Carrello ---------- */
function addToCart(code,variant,extra){
  const m=BY[code]; if(!m) return;
  const v=variant||(m.v?(S.pick[code]||m.v[0][0]):'');
  const key=code+'|'+v+(extra?'|'+extra.desc:'');
  const cur=S.cart.get(key)||{c:code,v,q:0,price:extra?extra.price:priceOf(m,v),label:extra?extra.label:m.n,desc:extra?extra.desc:'',zh:m.z};
  cur.q++; S.cart.set(key,cur);
  toast(`Aggiunto: ${cur.label}${v?' · '+v:''}`);
  updateCartBar(); if(S.view==='cliente') renderDishes();
}
function cartTotals(){const sub=[...S.cart.values()].reduce((a,x)=>a+x.q*x.price,0);const cop=S.cart.size?S.people*COPERTO:0;return{sub,cop,tot:sub+cop,n:[...S.cart.values()].reduce((a,x)=>a+x.q,0)};}
function updateCartBar(){const {tot,n}=cartTotals();const bar=$('#cartbar');bar.hidden=!(n&&S.view==='cliente');$('#cartCnt').textContent=n;$('#cartTot').textContent=eur(tot);}

function sendOrder(){
  const id=++S.seq;
  const items=[...S.cart.values()].map(x=>({q:x.q,c:x.c,v:x.v,desc:x.desc,label:x.label}));
  S.tickets.unshift({id,src:'Tavolo '+S.table,qr:true,status:'new',t:Date.now(),items,note:S.note});
  S.myTicket=id; S.cart.clear(); S.note=''; closeSheet(); render();
  toast(`Ordine #${id} inviato. Apri la scheda Cucina per vederlo arrivare.`);
}

}

            `<label class="eyebrow" for="draft${i}">Bozza di risposta</label><textarea id="draft${i}">${esc(r.draft)}</textarea><button class="btn" type="button" data-reply="${i}" style="align-self:flex-start">Pubblica risposta</button>`}</div>`).join('')}
        </section>
      </div>
      <div class="stack">
        <section class="panel"><div class="panel-h"><h3>Prenotazioni di oggi</h3><span class="note">${S.bookings.reduce((a,b)=>a+b.p,0)} persone</span></div>
          <div>${S.bookings.map(b=>`<div class="book"><span class="t">${b.t}</span><div><b>${esc(b.name)}</b> · ${b.p} pers.${b.note?`<div class="note">${esc(b.note)}</div>`:''}</div><span class="pill ${b.src.includes('nuova')?'warn':'ok'}">${esc(b.src)}</span></div>`).join('')}</div>
        </section>
        <section class="panel"><div class="panel-h"><h3>Piatti più ordinati</h3><span class="note">ultimi 7 giorni</span></div>
          <ul class="top-list">${top.map(([n,c,q])=>`<li><span>${n} <span class="han muted">${BY[c].z}</span></span><b class="num">${q}</b><span class="bar"><i style="width:${q/31*100}%"></i></span></li>`).join('')}</ul>
        </section>
        <section class="panel"><div class="panel-h"><h3>Disponibilità piatti</h3><span class="note">si aggiorna subito sul menu</span></div>
          <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="aq" type="search" placeholder="Cerca un piatto" aria-label="Cerca un piatto"></div>
          <div class="avail" id="avail"></div>
        </section>
      </div>
    </div></div>`;
  const drawAvail=q=>{$('#avail').innerHTML=MENU.filter(m=>!['bev','birra','vino'].includes(m.k)).filter(m=>!q||m.n.toLowerCase().includes(q)||m.z.includes(q)||m.c===q)
    .map(m=>`<label><span class="mono muted" style="font-size:.75rem">${m.c}</span><span>${m.n}${S.soldOut.has(m.c)?' <span class="pill warn">esaurito</span>':''}</span><input class="switch" type="checkbox" data-avail="${m.c}" ${S.soldOut.has(m.c)?'':'checked'} aria-label="${esc(m.n)} disponibile"></label>`).join('');};
  drawAvail(''); $('#aq').addEventListener('input',e=>drawAvail(e.target.value.trim().toLowerCase()));
}

/* ---------- Eventi ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-cat]'); if(!b) return;
  const d=b.dataset;
  if(d.cat){S.cat=d.cat;renderClient();const el=document.getElementById('cat-'+d.cat);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(d.al){S.excl.has(d.al)?S.excl.delete(d.al):S.excl.add(d.al);b.setAttribute('aria-pressed',S.excl.has(d.al));renderDishes();const s=document.querySelector('details.allerg summary span');if(s)s.innerHTML=`Allergie o intolleranze?${S.excl.size?` <span class="pill warn">${S.excl.size} esclusi</span>`:''}`;return;}
  if(d.var){const [c,v]=d.var.split('|');S.pick[c]=v;renderDishes();return;}
  if(d.add){addToCart(d.add);return;}
  if(d.inc||d.dec){const k=d.inc||d.dec;const x=S.cart.get(k);if(!x)return;x.q+=d.inc?1:-1;if(x.q<=0)S.cart.delete(k);updateCartBar();cartSheet();return;}
  if(d.adv){const [id,st]=d.adv.split('|');const t=S.tickets.find(x=>x.id==id);if(t){t.status=st;if(st==='done'&&t.id!==S.myTicket)S.tickets=S.tickets.filter(x=>x!==t);}
    toast(st==='prep'?`#${id} in preparazione`:st==='ready'?`#${id} pronto: il cliente lo vede sul telefono`:`#${id} servito`);renderKDS();updateBadge();return;}
  if(d.ack){S.alerts.splice(+d.ack,1);renderKDS();updateBadge();return;}
  if(d.reply){const i=+d.reply;REVIEWS[i].draft=$('#draft'+i).value;S.replied.add(i);renderOwner();toast('Risposta pronta. In produzione viene pubblicata su Google.');return;}
  if(d.go){if(d.go==='lunch'){location.hash='cliente';setTimeout(lunchSheet,50);}else if(d.go==='book'){location.hash='cliente';setTimeout(bookSheet,50);}else location.hash=d.go;return;}
  switch(d.act){
    case 'close':closeSheet();break;
    case 'send':sendOrder();break;
    case 'lunch':lunchSheet();break;
    case 'book':bookSheet();break;
    case 'waiter':S.alerts.push({txt:`Tavolo ${S.table} chiama il cameriere`,t:Date.now()});updateBadge();toast('Il cameriere è stato avvisato.');break;
    case 'bill':S.alerts.push({txt:`Tavolo ${S.table} chiede il conto`,t:Date.now()});updateBadge();toast('Richiesta del conto inviata alla sala.');break;
    case 'lunchAdd':{const g=n=>document.querySelector(`input[name="${n}"]:checked`).value;const p=g('primo'),s=g('secondo'),bv=g('bev');
      addToCart(p,'',{price:LUNCH.price,label:'Menu pranzo',desc:`${BY[p].n} + ${BY[s].n} + ${BY[bv].n}`});closeSheet();break;}
  }
});
document.addEventListener('change',e=>{const c=e.target.closest('[data-avail]');if(!c)return;const k=c.dataset.avail;c.checked?S.soldOut.delete(k):S.soldOut.add(k);
  const lab=c.closest('label').children[1];lab.innerHTML=BY[k].n+(S.soldOut.has(k)?' <span class="pill warn">esaurito</span>':'');
  toast(c.checked?`${BY[k].n}: di nuovo disponibile sul menu`:`${BY[k].n}: segnato come esaurito sul menu`);});
$('#openCart').addEventListener('click',cartSheet);
$('#langBtn').addEventListener('click',()=>{S.lang=S.lang==='it'?'zh':'it';$('#langBtn').textContent=S.lang==='it'?'IT · 中文':'中文 · IT';renderClient();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
setInterval(()=>{if(S.view==='cucina'&&!$('#sheetRoot').innerHTML)renderKDS(); if(S.view==='cliente')renderStatus();},30e3);
route();
